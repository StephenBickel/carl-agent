name: Carl exact active-merge soak scheduler

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carl-autonomy-soak-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  schedule:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Schedule the exact active merge or its urgent revert
    environment: carl-autonomy-soak
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 10
    steps:
      - name: Check out protected coordinator code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.12"
          enable-cache: false
      - name: Select from PostgreSQL truth and advance one exact soak node
        env:
          CARL_STATE_BACKEND: postgresql
          HARD_FAILURE_REVERT_SLA_HOURS: "2"
          SOAK_STALE_CRITICAL_HOURS: "26"
        run: |
          set -euo pipefail
          test "$CARL_STATE_BACKEND" = postgresql
          test "$SOAK_STALE_CRITICAL_HOURS" = "26"
          test "$HARD_FAILURE_REVERT_SLA_HOURS" = "2"
          # The protected coordinator reconstructs the exact active merge from durable state;
          # neither the workflow revision nor caller input can select a candidate or merge.
          uv run --offline --project benchmarks --locked carl-bench cloud coordinate \
            --allowed-node create_revert \
            --allowed-node observe_revert \
            --allowed-node schedule_soak \
            --allowed-node observe_soak
