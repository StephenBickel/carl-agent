name: Carl autonomy supervisor recovery

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carl-autonomy-supervisor-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Recover one exact durable supervisor trigger
    environment: carl-autonomy-supervisor
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 30
    steps:
      - name: Check out the protected default-branch control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.12"
          enable-cache: false
      - name: Diagnose and execute one bounded materially different recovery
        env:
          CARL_GITHUB_APP_EFFECT_SOCKET: /run/carl/github-effect.sock
          CARL_MODEL_GATEWAY_SOCKET: /run/carl/model-gateway.sock
          CARL_STATE_BACKEND: postgresql
          SUPERVISOR_COORDINATOR_COMMAND: uv run --offline --project benchmarks --locked carl-bench cloud coordinate
          SUPERVISOR_PROMPT: docs/automation-prompts/carl-autonomy-supervisor.md
          SUPERVISOR_PROPOSAL: ${{ runner.temp }}/supervisor-proposal.json
          SUPERVISOR_RESULT: ${{ runner.temp }}/supervisor-result.json
          SUPERVISOR_TRIGGER: ${{ runner.temp }}/supervisor-trigger.json
        run: |
          set -euo pipefail
          test "$CARL_STATE_BACKEND" = postgresql
          test -S "$CARL_GITHUB_APP_EFFECT_SOCKET"
          test -S "$CARL_MODEL_GATEWAY_SOCKET"
          test -s "$SUPERVISOR_PROMPT"
          uv run --offline --project benchmarks --locked carl-bench supervisor inspect \
            > "$SUPERVISOR_TRIGGER"
          {
            cat "$SUPERVISOR_PROMPT"
            printf '\n\nExact PostgreSQL-selected trigger:\n'
            cat "$SUPERVISOR_TRIGGER"
          } | codex exec \
            --model gpt-5.6-sol \
            -c 'model_reasoning_effort="ultra"' \
            --sandbox workspace-write \
            --output-last-message "$SUPERVISOR_PROPOSAL" \
            -
          uv run --offline --project benchmarks --locked carl-bench supervisor recover \
            --proposal "$SUPERVISOR_PROPOSAL" \
            --repository "$GITHUB_WORKSPACE" \
            > "$SUPERVISOR_RESULT"
          cat "$SUPERVISOR_RESULT"
