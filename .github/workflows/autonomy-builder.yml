name: Carl autonomous remote product builder

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      request_digest:
        required: true
        type: string
      parent_commit:
        required: true
        type: string
      immutable_inputs_digest:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: carl-autonomy-builder-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Build one preregistered product candidate
    environment: carl-autonomy-builder
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 45
    outputs:
      candidate_packet_digest: ${{ steps.build.outputs.candidate_packet_digest }}
      experiment_id: ${{ steps.build.outputs.experiment_id }}
      publication_request_digest: ${{ steps.build.outputs.publication_request_digest }}
    steps:
      - name: Check out the exact protected default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.12"
          enable-cache: false
      - name: Reconstruct request and run the stateful protected builder
        id: build
        env:
          DISPATCH_IMMUTABLE_INPUTS_DIGEST: ${{ inputs.immutable_inputs_digest }}
          DISPATCH_PARENT_COMMIT: ${{ inputs.parent_commit }}
          DISPATCH_REQUEST_DIGEST: ${{ inputs.request_digest }}
          MAX_BUILDER_COST_MICRODOLLARS: "2000000"
          MAX_BUILDER_ELAPSED_SECONDS: "1800"
          MAX_BUILDER_REPAIRS: "2"
          PRODUCT_BUILDER_PROMPT: docs/automation-prompts/carl-product-builder.md
        run: |
          set -euo pipefail
          umask 077
          test "$MAX_BUILDER_REPAIRS" = "2"
          test "$MAX_BUILDER_ELAPSED_SECONDS" = "1800"
          test "$MAX_BUILDER_COST_MICRODOLLARS" = "2000000"
          sandbox_home="$RUNNER_TEMP/carl-candidate-home"
          install -d -m 0700 "$sandbox_home"
          SANDBOX_HOME="$sandbox_home" uv run --offline --project benchmarks --locked python - <<'PY'
          import json
          import os
          from pathlib import Path

          from carl_bench.product_builder import credential_free_candidate_environment

          environment = credential_free_candidate_environment(
              dict(os.environ), sandbox_home=Path(os.environ["SANDBOX_HOME"])
          )
          destination = Path(os.environ["RUNNER_TEMP"]) / "candidate-environment.json"
          destination.write_text(
              json.dumps(environment, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          test -s "$RUNNER_TEMP/candidate-environment.json"
          # The protected driver reconstructs durable novelty/cooldown state, registers the exact
          # manifest through the builder state role, then calls the controller-owned gateway.
          # Candidate commands receive only candidate-environment.json, never this job environment.
          uv run --offline --project benchmarks --locked python -m carl_bench.product_builder \
            run-protected \
            --candidate-environment "$RUNNER_TEMP/candidate-environment.json" \
            --prompt "$PRODUCT_BUILDER_PROMPT" \
            --request-digest "$DISPATCH_REQUEST_DIGEST" \
            --parent-commit "$DISPATCH_PARENT_COMMIT" \
            --immutable-inputs-digest "$DISPATCH_IMMUTABLE_INPUTS_DIGEST" \
            --result "$RUNNER_TEMP/builder-terminal.json"
          RESULT_PATH="$RUNNER_TEMP/builder-terminal.json" uv run --offline --project benchmarks --locked python - <<'PY'
          import json
          import os
          from pathlib import Path

          from carl_bench.canonical import canonical_json_bytes
          from carl_bench.openai_gateway import OpenAIModelGateway
          from carl_bench.product_builder import preregister_and_call_model

          # These exact protected interfaces are used by run-protected; this import check prevents
          # a workflow revision from silently selecting a substitute gateway or call order.
          assert OpenAIModelGateway.from_protected_environment
          assert preregister_and_call_model
          path = Path(os.environ["RESULT_PATH"])
          raw = path.read_bytes()
          value = json.loads(raw)
          if canonical_json_bytes(value) != raw:
              raise SystemExit("builder_terminal_not_canonical")
          if value.get("outcome") not in {
              "candidate_packet",
              "experimental_publication",
              "repair_request",
              "retained_learning",
          }:
              raise SystemExit("builder_report_only_terminal_forbidden")
          if value.get("next_safe_node") in (None, ""):
              raise SystemExit("builder_next_safe_node_missing")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for name in ("candidate_packet_digest", "experiment_id", "publication_request_digest"):
                  item = value.get(name)
                  if item is not None:
                      print(f"{name}={item}", file=output)
          PY

  publish:
    if: needs.build.outputs.candidate_packet_digest != ''
    needs: build
    name: Publish one immutable experimental ref
    environment: carl-autonomy-builder
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 10
    steps:
      - name: Check out the exact protected default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.12"
          enable-cache: false
      - name: Publish through the protected GitHub App effect boundary
        env:
          CANDIDATE_PACKET_DIGEST: ${{ needs.build.outputs.candidate_packet_digest }}
          CARL_GITHUB_APP_EFFECT_SOCKET: /run/carl/github-effects.sock
          EXPERIMENT_ID: ${{ needs.build.outputs.experiment_id }}
          PROTECTED_NODE: publish_experimental
          PUBLICATION_REQUEST_DIGEST: ${{ needs.build.outputs.publication_request_digest }}
        run: |
          set -euo pipefail
          test -S "$CARL_GITHUB_APP_EFFECT_SOCKET"
          uv run --offline --project benchmarks --locked python - <<'PY'
          from carl_bench.experimental_publication import reconcile_experimental_publication
          from carl_bench.github_effect_client import GitHubEffectSocketClient

          assert reconcile_experimental_publication
          GitHubEffectSocketClient.from_protected_environment()
          PY
          published=false
          for _ in 1 2 3 4 5 6 7 8; do
            set +e
            RESULT="$(uv run --offline --project benchmarks --locked carl-bench cloud coordinate)"
            STATUS=$?
            set -e
            test "$STATUS" -eq 0 -o "$STATUS" -eq 2
            RESULT="$RESULT" uv run --offline --project benchmarks --locked python - <<'PY'
          import json
          import os

          from carl_bench.canonical import canonical_json_bytes

          raw = os.environ["RESULT"].encode("utf-8")
          value = json.loads(raw)
          if canonical_json_bytes(value) != raw or value.get("schema_version") != 1:
              raise SystemExit("builder_publication_result_invalid")
          if value.get("node") != os.environ["PROTECTED_NODE"]:
              raise SystemExit("builder_publication_node_mismatch")
          if value.get("experiment_id") != os.environ["EXPERIMENT_ID"]:
              raise SystemExit("builder_publication_experiment_mismatch")
          if value.get("action") == "frozen":
              raise SystemExit("builder_publication_frozen")
          if value.get("action") == "complete_command" and value.get("result_digest"):
              with open(os.environ["RUNNER_TEMP"] + "/publication-complete", "x") as output:
                  output.write(value["result_digest"] + "\n")
          PY
            if test -s "$RUNNER_TEMP/publication-complete"; then
              published=true
              break
            fi
          done
          test "$published" = true

  dispatch_validation:
    if: needs.publish.result == 'success'
    needs: [build, publish]
    name: Explicitly dispatch protected validation
    environment: carl-autonomy-coordinator
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 10
    steps:
      - name: Check out the exact protected default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.12"
          enable-cache: false
      - name: Dispatch validation through the protected GitHub App client
        env:
          CARL_GITHUB_APP_EFFECT_SOCKET: /run/carl/github-effects.sock
          PROTECTED_NODE: dispatch_validation
          REQUEST_DIGEST: ${{ needs.build.outputs.publication_request_digest }}
        run: |
          set -euo pipefail
          test -S "$CARL_GITHUB_APP_EFFECT_SOCKET"
          uv run --offline --project benchmarks --locked python - <<'PY'
          from carl_bench.github_effect_client import GitHubEffectSocketClient

          # Construction proves this stage is routed to the protected GitHub App effect service.
          GitHubEffectSocketClient.from_protected_environment()
          PY
          uv run --offline --project benchmarks --locked carl-bench cloud coordinate
