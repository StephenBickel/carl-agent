name: Benchmark contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-contracts:
    name: Benchmark contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARL_POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/carl_test
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: carl_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: benchmarks/uv.lock
          cache-local-path: ~/.cache/uv
          cache-python: false
      - name: Install locked benchmark dependencies
        run: uv sync --project benchmarks --python 3.12 --locked
      - name: Install Linux commissioning sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap postgresql-client
          sudo install -d -o root -g root -m 0555 /var/empty
          bwrap --version
      - name: Migrate PostgreSQL 16 autonomy state
        run: |
          pg_isready --dbname "$CARL_POSTGRES_TEST_DSN" --timeout 30
          psql --set ON_ERROR_STOP=1 --dbname "$CARL_POSTGRES_TEST_DSN" \
            --file infra/autonomy/postgres/001_initial.sql
          psql --set ON_ERROR_STOP=1 --dbname "$CARL_POSTGRES_TEST_DSN" \
            --file infra/autonomy/postgres/002_role_procedures.sql
          psql --set ON_ERROR_STOP=1 --dbname "$CARL_POSTGRES_TEST_DSN" \
            --file infra/autonomy/postgres/003_github_effect_fences.sql
          psql --set ON_ERROR_STOP=1 --dbname "$CARL_POSTGRES_TEST_DSN" \
            --file infra/autonomy/postgres/004_coordinator_runtime.sql
          psql --set ON_ERROR_STOP=1 --dbname "$CARL_POSTGRES_TEST_DSN" \
            --file infra/autonomy/postgres/005_supervisor_authority.sql
      - name: Test PostgreSQL state integration
        run: >-
          uv run --offline --project benchmarks --locked pytest -q
          benchmarks/tests/test_postgres_state_integration.py
      - name: Test benchmark contracts
        run: uv run --offline --project benchmarks --locked pytest -q benchmarks/tests
      - name: Lint benchmark code
        run: uv run --offline --project benchmarks --locked ruff check benchmarks
      - name: Run offline benchmark smoke
        run: ./scripts/benchmark-smoke.sh
