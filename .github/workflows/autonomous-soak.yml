name: Autonomous soak observation
run-name: ${{ inputs.attempt_key }}

"on":
  workflow_dispatch:
    inputs:
      attempt_key:
        description: Exact durable cloud dispatch attempt key
        required: true
        type: string
      experiment_digest:
        description: Immutable experiment manifest SHA-256
        required: true
        type: string
      parent_commit:
        description: Exact pre-merge first parent commit
        required: true
        type: string
      candidate_commit:
        description: Exact two-parent production merge commit
        required: true
        type: string
      task_set_digest:
        description: Normalized immutable soak task-set archive SHA-256
        required: true
        type: string
      metric_pack_digest:
        description: Immutable health metric-pack SHA-256
        required: true
        type: string
      policy_digest:
        description: Immutable soak policy SHA-256
        required: true
        type: string
      request_digest:
        description: Canonical cloud request SHA-256
        required: true
        type: string
      workflow_revision:
        description: Exact protected workflow source commit
        required: true
        type: string
      workflow_blob_digest:
        description: Exact protected workflow file SHA-256
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: autonomous-soak-${{ inputs.request_digest }}
  cancel-in-progress: false

jobs:
  commission:
    name: Bind exact merge topology and six-hour cadence
    environment: carl-autonomy-soak
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the protected parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.workflow_revision }}
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the exact production merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_commit }}
          path: merge-source
          fetch-depth: 2
          persist-credentials: false
      - name: Validate request cadence and immediate-parent topology
        env:
          ATTEMPT_KEY: ${{ inputs.attempt_key }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPERIMENT_DIGEST: ${{ inputs.experiment_digest }}
          METRIC_PACK_DIGEST: ${{ inputs.metric_pack_digest }}
          PARENT_COMMIT: ${{ inputs.parent_commit }}
          POLICY_DIGEST: ${{ inputs.policy_digest }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          RUN_HEAD_SHA: ${{ github.sha }}
          SOAK_CADENCE_HOURS: "6"
          TASK_SET_DIGEST: ${{ inputs.task_set_digest }}
          WORKFLOW_BLOB_DIGEST: ${{ inputs.workflow_blob_digest }}
          WORKFLOW_PATH: .github/workflows/autonomous-soak.yml
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$SOAK_CADENCE_HOURS" = "6"
          test "$RUN_HEAD_SHA" = "$WORKFLOW_REVISION"
          test "$WORKFLOW_SHA" = "$WORKFLOW_REVISION"
          test "${WORKFLOW_REF%%@*}" = "$REPOSITORY/$WORKFLOW_PATH"
          test "$(git -C trusted-source rev-parse HEAD)" = "$WORKFLOW_REVISION"
          printf '%s  %s\n' "$WORKFLOW_BLOB_DIGEST" \
            "trusted-source/$WORKFLOW_PATH" | sha256sum --check --strict -
          test "$(git -C merge-source rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          read -r -a MERGE_TOPOLOGY <<< "$(git -C merge-source rev-list --parents -n 1 "$CANDIDATE_COMMIT")"
          test "${#MERGE_TOPOLOGY[@]}" -eq 3
          test "${MERGE_TOPOLOGY[0]}" = "$CANDIDATE_COMMIT"
          test "${MERGE_TOPOLOGY[1]}" = "$PARENT_COMMIT"
          python3 - <<'PY'
          import hashlib, json, os, re
          digest = re.compile(r"[0-9a-f]{64}\Z")
          commit = re.compile(r"(?:[0-9a-f]{40}|[0-9a-f]{64})\Z")
          for name in ("EXPERIMENT_DIGEST", "METRIC_PACK_DIGEST", "POLICY_DIGEST",
                       "REQUEST_DIGEST", "TASK_SET_DIGEST", "WORKFLOW_BLOB_DIGEST"):
              if not digest.fullmatch(os.environ[name]): raise SystemExit(f"invalid {name.lower()}")
          for name in ("PARENT_COMMIT", "CANDIDATE_COMMIT", "WORKFLOW_REVISION"):
              if not commit.fullmatch(os.environ[name]): raise SystemExit(f"invalid {name.lower()}")
          prefix = f"cloud-run-{os.environ['REQUEST_DIGEST']}-attempt-"
          if os.environ["ATTEMPT_KEY"] not in {prefix + "1", prefix + "2", prefix + "3"}:
              raise SystemExit("attempt_key mismatch")
          payload = {
              "candidate_commit": os.environ["CANDIDATE_COMMIT"],
              "experiment_digest": os.environ["EXPERIMENT_DIGEST"],
              "metric_pack_digest": os.environ["METRIC_PACK_DIGEST"],
              "parent_commit": os.environ["PARENT_COMMIT"],
              "policy_digest": os.environ["POLICY_DIGEST"],
              "repository": os.environ["REPOSITORY"],
              "schema_version": 1,
              "task_set_digest": os.environ["TASK_SET_DIGEST"],
              "workflow_file": "autonomous-soak.yml",
              "workflow_revision": os.environ["WORKFLOW_REVISION"],
              "workflow_blob_digest": os.environ["WORKFLOW_BLOB_DIGEST"],
          }
          encoded = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          if hashlib.sha256(encoded).hexdigest() != os.environ["REQUEST_DIGEST"]:
              raise SystemExit("request_digest mismatch")
          PY
      - name: Run actionlint commissioning gate
        working-directory: trusted-source
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            .github/workflows/autonomous-improvement.yml \
            .github/workflows/autonomous-soak.yml

  evaluate:
    name: Run merge-bound probes without protected credentials
    needs: [commission]
    outputs:
      health_result_digest: ${{ steps.health.outputs.health_result_digest }}
    environment: carl-autonomy-subject
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted harness from protected parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.workflow_revision }}
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact merge subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_commit }}
          path: subject-merge
          fetch-depth: 2
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.12"
          enable-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - name: Verify immutable inputs outside subject authority
        id: immutable_inputs
        env:
          EXPERIMENT_DIGEST: ${{ inputs.experiment_digest }}
          METRIC_PACK_DIGEST: ${{ inputs.metric_pack_digest }}
          POLICY_DIGEST: ${{ inputs.policy_digest }}
          TASK_SET_DIGEST: ${{ inputs.task_set_digest }}
        run: |
          set -euo pipefail
          resolved="$RUNNER_TEMP/immutable-inputs"; mkdir -p "$resolved"
          PYTHONPATH=trusted-source/benchmarks/src python -m carl_bench.immutable_inputs resolve-set \
            --registry trusted-source/benchmarks/immutable-inputs/registry.json \
            --root trusted-source/benchmarks/immutable-inputs \
            --mode soak \
            --task-media-type application/vnd.carl.soak-task-set+tar \
            --experiment-digest "$EXPERIMENT_DIGEST" \
            --task-set-digest "$TASK_SET_DIGEST" \
            --metric-pack-digest "$METRIC_PACK_DIGEST" \
            --policy-digest "$POLICY_DIGEST" \
            --output-dir "$resolved" >/dev/null
          printf '%s  %s\n' \
            "$EXPERIMENT_DIGEST" "$resolved/experiment" \
            "$TASK_SET_DIGEST" "$resolved/task-set" \
            "$METRIC_PACK_DIGEST" "$resolved/metric-pack" \
            "$POLICY_DIGEST" "$resolved/policy" \
            | sha256sum --check --strict -
          printf 'experiment=%s\n' "$resolved/experiment" >> "$GITHUB_OUTPUT"
          printf 'task_set=%s\n' "$resolved/task-set" >> "$GITHUB_OUTPUT"
          printf 'metric_pack=%s\n' "$resolved/metric-pack" >> "$GITHUB_OUTPUT"
          printf 'policy=%s\n' "$resolved/policy" >> "$GITHUB_OUTPUT"
      - name: Run repository health probes without workflow commands or credentials
        id: health
        env:
          EXPERIMENT_INPUT: ${{ steps.immutable_inputs.outputs.experiment }}
          MERGE_COMMIT: ${{ inputs.candidate_commit }}
          METRIC_PACK_INPUT: ${{ steps.immutable_inputs.outputs.metric_pack }}
          POLICY_INPUT: ${{ steps.immutable_inputs.outputs.policy }}
          TASK_SET_INPUT: ${{ steps.immutable_inputs.outputs.task_set }}
        run: |
          set -euo pipefail
          chmod 700 "$(dirname "$GITHUB_ENV")"
          test "$(git -C subject-merge rev-parse HEAD)" = "$MERGE_COMMIT"
          rust_probe_root="$RUNNER_TEMP/rust-probe"
          python_probe_root="$RUNNER_TEMP/python-probe"
          trusted_benchmark_root="$RUNNER_TEMP/trusted-benchmark-probe"
          sandbox="$RUNNER_TEMP/sandbox-merge"
          cp -R -- subject-merge "$rust_probe_root"
          if find "$rust_probe_root" -type l -print -quit | grep -q .; then
            echo "candidate symlinks cannot enter protected probes" >&2
            exit 1
          fi
          rm -rf -- "$rust_probe_root/.cargo" "$rust_probe_root/tests"
          rm -f -- "$rust_probe_root/build.rs"
          cp -- trusted-source/Cargo.toml trusted-source/Cargo.lock "$rust_probe_root/"
          cp -R -- trusted-source/tests "$rust_probe_root/tests"
          cp -R -- trusted-source/benchmarks "$python_probe_root"
          rm -rf -- "$python_probe_root/src/carl_bench"
          test -d subject-merge/benchmarks/src/carl_bench
          if find subject-merge/benchmarks/src/carl_bench -type l -print -quit | grep -q .; then
            echo "candidate Python symlinks cannot enter protected probes" >&2
            exit 1
          fi
          cp -R -- subject-merge/benchmarks/src/carl_bench "$python_probe_root/src/carl_bench"
          cp -R -- trusted-source/benchmarks "$trusted_benchmark_root"
          rm -rf -- "$trusted_benchmark_root/tasks/dev"
          mkdir -p "$trusted_benchmark_root/tasks/dev"
          tar --extract --file "$TASK_SET_INPUT" --directory "$trusted_benchmark_root/tasks/dev" \
            --no-same-owner --no-same-permissions
          chmod -R a-w "$rust_probe_root" "$python_probe_root" "$trusted_benchmark_root"
          mkdir -p "$sandbox/home" "$sandbox/tmp" "$sandbox/cargo" "$sandbox/target" \
            "$sandbox/uv" "$sandbox/python-venv" "$sandbox/trusted-venv"
          chown -R nobody:nogroup "$sandbox"
          run_subject() {
            sudo -u nobody env -i HOME="$sandbox/home" PATH="$PATH" TMPDIR="$sandbox/tmp" \
              CARGO_HOME="$sandbox/cargo" CARGO_TARGET_DIR="$sandbox/target" \
              RUSTUP_HOME="$RUSTUP_HOME" UV_CACHE_DIR="$sandbox/uv" PYTHONDONTWRITEBYTECODE=1 \
              PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 UV_PROJECT_ENVIRONMENT="$sandbox/python-venv" \
              MERGE_COMMIT="$MERGE_COMMIT" PYTHON_PROBE_ROOT="$python_probe_root" \
              RUST_PROBE_ROOT="$rust_probe_root" \
              TRUSTED_BENCHMARK_ROOT="$trusted_benchmark_root" \
              TRUSTED_VENV="$sandbox/trusted-venv" bash --noprofile --norc -c "$1"
          }
          rust_contracts=false
          if run_subject 'set -euo pipefail; cd "$RUST_PROBE_ROOT"; cargo +1.97.0 test --locked --test workflow_contract --test docs_contract'; then rust_contracts=true; fi
          python_contracts=false
          if run_subject 'set -euo pipefail; cd "$TMPDIR"; uv sync --project "$PYTHON_PROBE_ROOT" --python 3.12 --locked; uv run --offline --project "$PYTHON_PROBE_ROOT" --locked pytest -q -c /dev/null -p no:cacheprovider --confcutdir "$PYTHON_PROBE_ROOT/tests" "$PYTHON_PROBE_ROOT/tests/test_integration_contract.py" "$PYTHON_PROBE_ROOT/tests/test_cloud_execution.py"'; then python_contracts=true; fi
          benchmark_smoke=false
          if run_subject 'set -euo pipefail; export UV_PROJECT_ENVIRONMENT="$TRUSTED_VENV"; cd "$TMPDIR"; uv sync --project "$TRUSTED_BENCHMARK_ROOT" --python 3.12 --locked; PYTHONPATH="$TRUSTED_BENCHMARK_ROOT/src" uv run --offline --project "$TRUSTED_BENCHMARK_ROOT" --locked carl-bench tasks validate --root "$TRUSTED_BENCHMARK_ROOT/tasks/dev"; PYTHONPATH="$TRUSTED_BENCHMARK_ROOT/src" uv run --offline --project "$TRUSTED_BENCHMARK_ROOT" --locked carl-bench run --tasks "$TRUSTED_BENCHMARK_ROOT/tasks/dev" --adapter scripted --attempts 1 --seed 20260810 --subject-commit "$MERGE_COMMIT" --public-result "$TMPDIR/scorecard.json"; PYTHONPATH="$TRUSTED_BENCHMARK_ROOT/src" uv run --offline --project "$TRUSTED_BENCHMARK_ROOT" --locked python -c '\''import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); assert value["subject_commit"] == sys.argv[2]; assert value["passed_trials"] == 3; assert value["valid_trials"] == 3; assert value["invalid_trials"] == 0; assert value["pass_rate"] == 1.0'\'' "$TMPDIR/scorecard.json" "$MERGE_COMMIT"'; then benchmark_smoke=true; fi
          observations="$RUNNER_TEMP/soak-observations.json"
          printf '{"benchmark-smoke":%s,"python-contracts":%s,"rust-contracts":%s}' \
            "$benchmark_smoke" "$python_contracts" "$rust_contracts" > "$observations"
          PYTHONPATH=trusted-source/benchmarks/src python -m carl_bench.immutable_inputs soak-health \
            --experiment "$EXPERIMENT_INPUT" --task-set "$TASK_SET_INPUT" \
            --metric-pack "$METRIC_PACK_INPUT" --policy "$POLICY_INPUT" \
            --observations "$observations" --output "$RUNNER_TEMP/health-result.json"
          test -f "$RUNNER_TEMP/health-result.json"; test ! -L "$RUNNER_TEMP/health-result.json"
          test "$(wc -c < "$RUNNER_TEMP/health-result.json")" -le 65536
          health_result_digest="$(sha256sum "$RUNNER_TEMP/health-result.json" | cut -d' ' -f1)"
          printf 'health_result_digest=%s\n' "$health_result_digest" >> "$GITHUB_OUTPUT"
      - name: Hand exact health outcome to the protected observer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-soak-health-${{ inputs.request_digest }}
          path: ${{ runner.temp }}/health-result.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  live_soak:
    name: Require commissioned durable provider reconciliation
    needs: [commission, evaluate]
    outputs:
      accept_ready: ${{ steps.observation.outputs.accept_ready }}
      protected_health_receipt_digest: ${{ steps.observation.outputs.protected_health_receipt_digest }}
      trusted_observed_at: ${{ steps.observation.outputs.trusted_observed_at }}
    environment: carl-autonomy-soak
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 60
    steps:
      - name: Retrieve protected soak inputs and execute exact merge observation
        id: observation
        env:
          ATTEMPT_KEY: ${{ inputs.attempt_key }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_OUTCOME_DIGEST: ${{ needs.evaluate.outputs.health_result_digest }}
          PARENT_COMMIT: ${{ inputs.parent_commit }}
          PREVIOUS_SOAK_RECEIPT_PATH: /var/lib/carl/soak/previous-signed-receipt.json
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          SOAK_CADENCE_HOURS: "6"
          SOAK_RECEIPT_KEYRING_PATH: /etc/carl/soak-observation-keyring.json
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: |
          set -euo pipefail
          /opt/carl-autonomy/venv/bin/python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, re
          from datetime import UTC, datetime, timedelta
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          from carl_bench.canonical import canonical_json_bytes

          EXPECTED_CHAIN_LENGTH = 5
          CADENCE_MIN = timedelta(hours=6)
          CADENCE_MAX = timedelta(hours=6, minutes=30)
          SOAK_MAX = timedelta(hours=26)
          DIGEST = re.compile(r"[0-9a-f]{64}\Z")

          def pairs(items):
              value = {}
              for key, item in items:
                  if key in value: raise SystemExit("signed soak receipt duplicate key")
                  value[key] = item
              return value

          def parse_time(value):
              if not isinstance(value, str) or not value.endswith("Z"):
                  raise SystemExit("signed soak receipt time invalid")
              parsed = datetime.fromisoformat(value[:-1] + "+00:00")
              if parsed.tzinfo != UTC or parsed.isoformat().replace("+00:00", "Z") != value:
                  raise SystemExit("signed soak receipt time invalid")
              return parsed

          def load_previous_signed_soak_receipt():
              raw = pathlib.Path(os.environ["PREVIOUS_SOAK_RECEIPT_PATH"]).read_bytes()
              if not 0 < len(raw) <= 16384: raise SystemExit("signed soak receipt size invalid")
              return json.loads(raw, object_pairs_hook=pairs)

          def verify_previous_signed_soak_receipt(receipt):
              if set(receipt) != {"domain", "key_id", "payload", "receipt_digest",
                                  "schema_version", "signature_base64"}:
                  raise SystemExit("signed soak receipt schema invalid")
              if (receipt["domain"] != "carl.soak-observation.chain-receipt.v2"
                      or receipt["schema_version"] != 2):
                  raise SystemExit("signed soak receipt schema invalid")
              payload = receipt["payload"]
              if type(payload) is not dict or set(payload) != {
                  "active_merge_commit", "health_receipt_digest", "merged_at",
                  "observation_chain", "previous_receipt_digest", "request_digest",
                  "schema_version"
              } or payload["schema_version"] != 2:
                  raise SystemExit("signed soak receipt payload invalid")
              encoded = canonical_json_bytes(payload)
              if (hashlib.sha256(encoded).hexdigest() != receipt["receipt_digest"]
                      or DIGEST.fullmatch(receipt["receipt_digest"]) is None):
                  raise SystemExit("signed soak receipt digest invalid")
              keyring_raw = pathlib.Path(os.environ["SOAK_RECEIPT_KEYRING_PATH"]).read_bytes()
              keyring = json.loads(keyring_raw, object_pairs_hook=pairs)
              if (set(keyring) != {"domain", "keys", "schema_version"}
                      or keyring["domain"] != "carl.soak-observation.keyring.v1"
                      or keyring["schema_version"] != 1
                      or type(keyring["keys"]) is not dict):
                  raise SystemExit("signed soak keyring invalid")
              pem = keyring["keys"].get(receipt["key_id"])
              if not isinstance(pem, str): raise SystemExit("signed soak key invalid")
              key = serialization.load_pem_public_key(pem.encode("ascii"))
              if not isinstance(key, Ed25519PublicKey): raise SystemExit("signed soak key invalid")
              key.verify(base64.b64decode(receipt["signature_base64"], validate=True), encoded)
              return payload

          def validate_observation_chain(payload):
              if (payload["active_merge_commit"] != os.environ["CANDIDATE_COMMIT"]
                      or payload["request_digest"] != os.environ["REQUEST_DIGEST"]
                      or payload["health_receipt_digest"] != os.environ["EXPECTED_OUTCOME_DIGEST"]):
                  raise SystemExit("signed soak chain binding mismatch")
              chain = payload["observation_chain"]
              if type(chain) is not list or not 1 <= len(chain) <= EXPECTED_CHAIN_LENGTH:
                  raise SystemExit("signed soak chain length invalid")
              if ((len(chain) == 1) != (payload["previous_receipt_digest"] is None)
                      or (len(chain) > 1
                          and DIGEST.fullmatch(payload["previous_receipt_digest"] or "") is None)):
                  raise SystemExit("signed soak previous receipt invalid")
              merged_at = parse_time(payload["merged_at"])
              previous_time = None
              previous_digest = None
              seen_digests = set()
              for index, item in enumerate(chain):
                  if type(item) is not dict or set(item) != {
                      "active_merge_commit", "health_receipt_digest", "merged_at",
                      "observation_digest", "observed_at", "previous_observation_digest",
                      "request_digest", "sequence"
                  }:
                      raise SystemExit("signed soak observation schema invalid")
                  if (type(item["sequence"]) is not int or item["sequence"] != index
                          or item["active_merge_commit"] != payload["active_merge_commit"]
                          or item["health_receipt_digest"] != payload["health_receipt_digest"]
                          or item["merged_at"] != payload["merged_at"]
                          or item["request_digest"] != payload["request_digest"]
                          or item["previous_observation_digest"] != previous_digest):
                      raise SystemExit("signed soak observation binding invalid")
                  core = {key: value for key, value in item.items() if key != "observation_digest"}
                  observation_digest = hashlib.sha256(canonical_json_bytes(core)).hexdigest()
                  if (item["observation_digest"] != observation_digest
                          or observation_digest in seen_digests):
                      raise SystemExit("signed soak observation replay invalid")
                  observed_at = parse_time(item["observed_at"])
                  if index == 0:
                      if chain[0]["observed_at"] != payload["merged_at"]:
                          raise SystemExit("signed soak chain anchor invalid")
                  else:
                      interval = observed_at - previous_time
                      if interval < CADENCE_MIN or interval > CADENCE_MAX:
                          raise SystemExit("signed soak observation cadence gap")
                  seen_digests.add(observation_digest)
                  previous_digest = observation_digest
                  previous_time = observed_at
              if previous_time > merged_at + SOAK_MAX:
                  raise SystemExit("soak_observation_stale_critical")
              return chain, merged_at, previous_time

          def trusted_current_time():
              return datetime.now(UTC)

          previous = verify_previous_signed_soak_receipt(load_previous_signed_soak_receipt())
          previous_chain, merged_at, previous_observed_at = validate_observation_chain(previous)
          now = trusted_current_time()
          if previous_observed_at > now:
              raise SystemExit("signed soak chronology invalid")
          if now > merged_at + SOAK_MAX:
              raise SystemExit("soak_observation_stale_critical")
          observation_due = len(previous_chain) < EXPECTED_CHAIN_LENGTH
          if observation_due and now < previous_observed_at + CADENCE_MIN:
              raise SystemExit("soak_observation_too_early")
          if observation_due and now > previous_observed_at + CADENCE_MAX:
              raise SystemExit("signed soak observation cadence gap")
          context = {
              "merged_at": previous["merged_at"],
              "observation_due": observation_due,
              "previous_observation_chain": previous_chain,
              "previous_receipt_digest": hashlib.sha256(
                  canonical_json_bytes(previous)
              ).hexdigest(),
              "trusted_before": now.isoformat().replace("+00:00", "Z"),
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "soak-cadence-context.json").write_bytes(
              canonical_json_bytes(context) + b"\n"
          )
          PY
          output="$RUNNER_TEMP/observe-soak.json"
          observation_due="$(/opt/carl-autonomy/venv/bin/python3 -I -c \
            'import json,os,pathlib; print(str(json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "soak-cadence-context.json").read_bytes())["observation_due"]).lower())')"
          if test "$observation_due" = "true"; then
            /opt/carl-autonomy/venv/bin/python3 -I - \
              commission-live observe_soak accept_soak "$REQUEST_DIGEST" \
              "$EXPECTED_OUTCOME_DIGEST" "$output" <<'PY'
          import hashlib, json, os, pathlib, re, stat, sys
          from carl_bench.canonical import canonical_json_bytes
          from carl_bench.cloud_coordinator import CloudCoordinatorDecision
          from carl_bench.coordinator_client import CoordinatorSocketClient
          from carl_bench.coordinator_ipc import CoordinatorServiceRequest

          command, expected_node, expected_successor, workflow_request_digest, outcome_digest, output = sys.argv[1:]
          digest = re.compile(r"[0-9a-f]{64}\Z")
          client = CoordinatorSocketClient.from_protected_environment()
          request = CoordinatorServiceRequest.create(command)
          expected_ipc_digest = request.digest

          FREEZE_ROOT = pathlib.Path("/var/lib/carl/protected-workflow-freezes")

