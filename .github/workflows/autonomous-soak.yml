                  raise SystemExit("soak_observation_stale_critical")
              return chain, merged_at, previous_time

          context = json.loads(
              pathlib.Path(os.environ["RUNNER_TEMP"], "soak-cadence-context.json").read_bytes(),
              object_pairs_hook=pairs,
          )
          receipt = json.loads(
              pathlib.Path(os.environ["PREVIOUS_SOAK_RECEIPT_PATH"]).read_bytes(),
              object_pairs_hook=pairs,
          )
          payload = verify_current_signed_soak_receipt(receipt)
          current_chain, merged_at, observed_at = validate_observation_chain(payload)
          if payload["merged_at"] != context["merged_at"]:
              raise SystemExit("current signed soak receipt binding mismatch")
          trusted_before = parse_time(context["trusted_before"])
          now = datetime.now(UTC)
          if observed_at > now or now > merged_at + SOAK_MAX:
              raise SystemExit("soak_observation_stale_critical")
          if context["observation_due"]:
              stage = json.loads(pathlib.Path(sys.argv[1]).read_bytes(), object_pairs_hook=pairs)
              if (payload["previous_receipt_digest"] != context["previous_receipt_digest"]
                      or current_chain[:-1] != context["previous_observation_chain"]
                      or len(current_chain) != len(context["previous_observation_chain"]) + 1
                      or stage["protected_receipt_digest"] != receipt["receipt_digest"]
                      or not trusted_before <= observed_at <= now
                      or observed_at > trusted_before + timedelta(hours=1)):
                  raise SystemExit("current signed soak chain extension invalid")
          elif (receipt["receipt_digest"] != context["previous_receipt_digest"]
                  or current_chain != context["previous_observation_chain"]
                  or len(current_chain) != EXPECTED_CHAIN_LENGTH):
              raise SystemExit("current signed soak receipt replay invalid")
          accept_ready = len(current_chain) == EXPECTED_CHAIN_LENGTH
          handoff_root = pathlib.Path(os.environ["RUNNER_TEMP"], "protected-soak-receipt-handoff")
          handoff_root.mkdir(mode=0o700)
          handoff = handoff_root / "soak-receipt.json"
          handoff.write_bytes(canonical_json_bytes(receipt) + b"\n")
          handoff.chmod(0o400)
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as outputs:
              outputs.write(f"accept_ready={str(accept_ready).lower()}\n")
              outputs.write(f"protected_health_receipt_digest={receipt['receipt_digest']}\n")
              outputs.write(f"trusted_observed_at={current_chain[-1]['observed_at']}\n")
