          import base64, hashlib, json, os, pathlib, re, sys
          from datetime import UTC, datetime, timedelta
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          from carl_bench.canonical import canonical_json_bytes

          EXPECTED_CHAIN_LENGTH = 5
          CADENCE_MIN = timedelta(hours=6)
          CADENCE_MAX = timedelta(hours=6, minutes=30)
          SOAK_MAX = timedelta(hours=26)
          DIGEST = re.compile(r"[0-9a-f]{64}\Z")

          def pairs(items):
              value = {}
              for key, item in items:
                  if key in value: raise SystemExit("signed soak receipt duplicate key")
                  value[key] = item
              return value

          def parse_time(value):
              if not isinstance(value, str) or not value.endswith("Z"):
                  raise SystemExit("signed soak receipt time invalid")
              parsed = datetime.fromisoformat(value[:-1] + "+00:00")
              if parsed.tzinfo != UTC or parsed.isoformat().replace("+00:00", "Z") != value:
                  raise SystemExit("signed soak receipt time invalid")
              return parsed

          def verify_current_signed_soak_receipt(receipt):
              if set(receipt) != {"domain", "key_id", "payload", "receipt_digest",
                                  "schema_version", "signature_base64"}:
                  raise SystemExit("current signed soak receipt schema invalid")
              payload = receipt["payload"]
              if (receipt["domain"] != "carl.soak-observation.chain-receipt.v2"
                      or receipt["schema_version"] != 2
                      or type(payload) is not dict
                      or set(payload) != {"active_merge_commit", "health_receipt_digest",
                                          "merged_at", "observation_chain",
                                          "previous_receipt_digest", "request_digest",
                                          "schema_version"}
                      or payload["schema_version"] != 2):
                  raise SystemExit("current signed soak receipt schema invalid")
              encoded = canonical_json_bytes(payload)
              if (hashlib.sha256(encoded).hexdigest() != receipt["receipt_digest"]
                      or DIGEST.fullmatch(receipt["receipt_digest"]) is None):
                  raise SystemExit("current signed soak receipt invalid")
              keyring = json.loads(
                  pathlib.Path(os.environ["SOAK_RECEIPT_KEYRING_PATH"]).read_bytes(),
                  object_pairs_hook=pairs,
              )
              if (set(keyring) != {"domain", "keys", "schema_version"}
                      or keyring["domain"] != "carl.soak-observation.keyring.v1"
                      or keyring["schema_version"] != 1
                      or type(keyring["keys"]) is not dict):
                  raise SystemExit("current signed soak keyring invalid")
              pem = keyring["keys"].get(receipt["key_id"])
              if not isinstance(pem, str): raise SystemExit("current signed soak key invalid")
              key = serialization.load_pem_public_key(pem.encode("ascii"))
              if not isinstance(key, Ed25519PublicKey):
                  raise SystemExit("current signed soak key invalid")
              key.verify(base64.b64decode(receipt["signature_base64"], validate=True), encoded)
              return payload

          def validate_observation_chain(payload):
              if (payload["active_merge_commit"] != os.environ["CANDIDATE_COMMIT"]
                      or payload["request_digest"] != os.environ["REQUEST_DIGEST"]
                      or payload["health_receipt_digest"] != os.environ["EXPECTED_OUTCOME_DIGEST"]):
                  raise SystemExit("current signed soak chain binding mismatch")
              chain = payload["observation_chain"]
              if type(chain) is not list or not 1 <= len(chain) <= EXPECTED_CHAIN_LENGTH:
                  raise SystemExit("current signed soak chain length invalid")
              if ((len(chain) == 1) != (payload["previous_receipt_digest"] is None)
                      or (len(chain) > 1
                          and DIGEST.fullmatch(payload["previous_receipt_digest"] or "") is None)):
                  raise SystemExit("current signed soak previous receipt invalid")
              merged_at = parse_time(payload["merged_at"])
              previous_time = None
              previous_digest = None
              seen_digests = set()
              for index, item in enumerate(chain):
                  if type(item) is not dict or set(item) != {
                      "active_merge_commit", "health_receipt_digest", "merged_at",
                      "observation_digest", "observed_at", "previous_observation_digest",
                      "request_digest", "sequence"
                  }:
                      raise SystemExit("current signed soak observation schema invalid")
                  if (type(item["sequence"]) is not int or item["sequence"] != index
                          or item["active_merge_commit"] != payload["active_merge_commit"]
                          or item["health_receipt_digest"] != payload["health_receipt_digest"]
                          or item["merged_at"] != payload["merged_at"]
                          or item["request_digest"] != payload["request_digest"]
                          or item["previous_observation_digest"] != previous_digest):
                      raise SystemExit("current signed soak observation binding invalid")
                  core = {key: value for key, value in item.items() if key != "observation_digest"}
                  observation_digest = hashlib.sha256(canonical_json_bytes(core)).hexdigest()
                  if (item["observation_digest"] != observation_digest
                          or observation_digest in seen_digests):
                      raise SystemExit("current signed soak observation replay invalid")
                  observed_at = parse_time(item["observed_at"])
                  if index == 0:
                      if chain[0]["observed_at"] != payload["merged_at"]:
                          raise SystemExit("current signed soak chain anchor invalid")
                  else:
                      interval = observed_at - previous_time
                      if interval < CADENCE_MIN or interval > CADENCE_MAX:
                          raise SystemExit("current signed soak observation cadence gap")
                  seen_digests.add(observation_digest)
                  previous_digest = observation_digest
                  previous_time = observed_at
