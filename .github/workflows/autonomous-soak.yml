name: Autonomous soak observation
run-name: ${{ inputs.attempt_key }}

"on":
  workflow_dispatch:
    inputs:
      attempt_key:
        description: Exact durable cloud dispatch attempt key
        required: true
        type: string
      experiment_digest:
        description: Immutable experiment manifest SHA-256
        required: true
        type: string
      parent_commit:
        description: Exact pre-merge first parent commit
        required: true
        type: string
      candidate_commit:
        description: Exact two-parent production merge commit
        required: true
        type: string
      task_set_digest:
        description: Normalized immutable soak task-set archive SHA-256
        required: true
        type: string
      metric_pack_digest:
        description: Immutable health metric-pack SHA-256
        required: true
        type: string
      policy_digest:
        description: Immutable soak policy SHA-256
        required: true
        type: string
      request_digest:
        description: Canonical cloud request SHA-256
        required: true
        type: string
      workflow_revision:
        description: Exact protected workflow source commit
        required: true
        type: string
      workflow_blob_digest:
        description: Exact protected workflow file SHA-256
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: autonomous-soak-${{ inputs.request_digest }}
  cancel-in-progress: false

jobs:
  commission:
    name: Bind exact merge topology and six-hour cadence
    environment: carl-autonomy-soak
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the protected parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.workflow_revision }}
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the exact production merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_commit }}
          path: merge-source
          fetch-depth: 2
          persist-credentials: false
      - name: Validate request cadence and immediate-parent topology
        env:
          ATTEMPT_KEY: ${{ inputs.attempt_key }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPERIMENT_DIGEST: ${{ inputs.experiment_digest }}
          METRIC_PACK_DIGEST: ${{ inputs.metric_pack_digest }}
          PARENT_COMMIT: ${{ inputs.parent_commit }}
          POLICY_DIGEST: ${{ inputs.policy_digest }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          RUN_HEAD_SHA: ${{ github.sha }}
          SOAK_CADENCE_HOURS: "6"
          TASK_SET_DIGEST: ${{ inputs.task_set_digest }}
          WORKFLOW_BLOB_DIGEST: ${{ inputs.workflow_blob_digest }}
          WORKFLOW_PATH: .github/workflows/autonomous-soak.yml
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$SOAK_CADENCE_HOURS" = "6"
          test "$RUN_HEAD_SHA" = "$WORKFLOW_REVISION"
          test "$WORKFLOW_SHA" = "$WORKFLOW_REVISION"
          test "${WORKFLOW_REF%%@*}" = "$REPOSITORY/$WORKFLOW_PATH"
          test "$(git -C trusted-source rev-parse HEAD)" = "$WORKFLOW_REVISION"
          printf '%s  %s\n' "$WORKFLOW_BLOB_DIGEST" \
            "trusted-source/$WORKFLOW_PATH" | sha256sum --check --strict -
          test "$(git -C merge-source rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          read -r -a MERGE_TOPOLOGY <<< "$(git -C merge-source rev-list --parents -n 1 "$CANDIDATE_COMMIT")"
          test "${#MERGE_TOPOLOGY[@]}" -eq 3
          test "${MERGE_TOPOLOGY[0]}" = "$CANDIDATE_COMMIT"
          test "${MERGE_TOPOLOGY[1]}" = "$PARENT_COMMIT"
          python3 - <<'PY'
          import hashlib, json, os, re
          digest = re.compile(r"[0-9a-f]{64}\Z")
          commit = re.compile(r"(?:[0-9a-f]{40}|[0-9a-f]{64})\Z")
          for name in ("EXPERIMENT_DIGEST", "METRIC_PACK_DIGEST", "POLICY_DIGEST",
                       "REQUEST_DIGEST", "TASK_SET_DIGEST", "WORKFLOW_BLOB_DIGEST"):
              if not digest.fullmatch(os.environ[name]): raise SystemExit(f"invalid {name.lower()}")
          for name in ("PARENT_COMMIT", "CANDIDATE_COMMIT", "WORKFLOW_REVISION"):
              if not commit.fullmatch(os.environ[name]): raise SystemExit(f"invalid {name.lower()}")
          prefix = f"cloud-run-{os.environ['REQUEST_DIGEST']}-attempt-"
          if os.environ["ATTEMPT_KEY"] not in {prefix + "1", prefix + "2", prefix + "3"}:
              raise SystemExit("attempt_key mismatch")
          payload = {
              "candidate_commit": os.environ["CANDIDATE_COMMIT"],
              "experiment_digest": os.environ["EXPERIMENT_DIGEST"],
              "metric_pack_digest": os.environ["METRIC_PACK_DIGEST"],
              "parent_commit": os.environ["PARENT_COMMIT"],
              "policy_digest": os.environ["POLICY_DIGEST"],
              "repository": os.environ["REPOSITORY"],
              "schema_version": 1,
              "task_set_digest": os.environ["TASK_SET_DIGEST"],
              "workflow_file": "autonomous-soak.yml",
              "workflow_revision": os.environ["WORKFLOW_REVISION"],
              "workflow_blob_digest": os.environ["WORKFLOW_BLOB_DIGEST"],
          }
          encoded = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          if hashlib.sha256(encoded).hexdigest() != os.environ["REQUEST_DIGEST"]:
              raise SystemExit("request_digest mismatch")
          PY
      - name: Run actionlint commissioning gate
        working-directory: trusted-source
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            .github/workflows/autonomous-improvement.yml \
            .github/workflows/autonomous-soak.yml

  evaluate:
    name: Run merge-bound probes without protected credentials
    needs: [commission]
    environment: carl-autonomy-subject
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted harness from protected parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.workflow_revision }}
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact merge subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_commit }}
          path: subject-merge
          fetch-depth: 2
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.12"
          enable-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - name: Verify immutable inputs outside subject authority
        id: immutable_inputs
        env:
          EXPERIMENT_DIGEST: ${{ inputs.experiment_digest }}
          METRIC_PACK_DIGEST: ${{ inputs.metric_pack_digest }}
          POLICY_DIGEST: ${{ inputs.policy_digest }}
          TASK_SET_DIGEST: ${{ inputs.task_set_digest }}
        run: |
          set -euo pipefail
          resolved="$RUNNER_TEMP/immutable-inputs"; mkdir -p "$resolved"
          PYTHONPATH=trusted-source/benchmarks/src python -m carl_bench.immutable_inputs resolve-set \
            --registry trusted-source/benchmarks/immutable-inputs/registry.json \
            --root trusted-source/benchmarks/immutable-inputs \
            --mode soak \
            --task-media-type application/vnd.carl.soak-task-set+tar \
            --experiment-digest "$EXPERIMENT_DIGEST" \
            --task-set-digest "$TASK_SET_DIGEST" \
            --metric-pack-digest "$METRIC_PACK_DIGEST" \
            --policy-digest "$POLICY_DIGEST" \
            --output-dir "$resolved" >/dev/null
          printf '%s  %s\n' \
            "$EXPERIMENT_DIGEST" "$resolved/experiment" \
            "$TASK_SET_DIGEST" "$resolved/task-set" \
            "$METRIC_PACK_DIGEST" "$resolved/metric-pack" \
            "$POLICY_DIGEST" "$resolved/policy" \
            | sha256sum --check --strict -
          printf 'experiment=%s\n' "$resolved/experiment" >> "$GITHUB_OUTPUT"
          printf 'task_set=%s\n' "$resolved/task-set" >> "$GITHUB_OUTPUT"
          printf 'metric_pack=%s\n' "$resolved/metric-pack" >> "$GITHUB_OUTPUT"
          printf 'policy=%s\n' "$resolved/policy" >> "$GITHUB_OUTPUT"
      - name: Run repository health probes without workflow commands or credentials
        id: health
        env:
          EXPERIMENT_INPUT: ${{ steps.immutable_inputs.outputs.experiment }}
          MERGE_COMMIT: ${{ inputs.candidate_commit }}
          METRIC_PACK_INPUT: ${{ steps.immutable_inputs.outputs.metric_pack }}
          POLICY_INPUT: ${{ steps.immutable_inputs.outputs.policy }}
          TASK_SET_INPUT: ${{ steps.immutable_inputs.outputs.task_set }}
        run: |
          set -euo pipefail
          chmod 700 "$(dirname "$GITHUB_ENV")"
          test "$(git -C subject-merge rev-parse HEAD)" = "$MERGE_COMMIT"
          eval_root="$RUNNER_TEMP/eval-merge"; sandbox="$RUNNER_TEMP/sandbox-merge"
          cp -R -- subject-merge "$eval_root"
          rm -rf -- "$eval_root/benchmarks/tests" "$eval_root/benchmarks/tasks/dev"
          cp -R -- trusted-source/benchmarks/tests "$eval_root/benchmarks/tests"
          mkdir -p "$eval_root/benchmarks/tasks/dev"
          tar --extract --file "$TASK_SET_INPUT" --directory "$eval_root/benchmarks/tasks/dev" \
            --no-same-owner --no-same-permissions
          cp -- trusted-source/scripts/benchmark-smoke.sh "$eval_root/scripts/benchmark-smoke.sh"
          chmod -R a-w "$eval_root"
          mkdir -p "$sandbox/home" "$sandbox/tmp" "$sandbox/cargo" "$sandbox/target" "$sandbox/uv"
          chown -R nobody:nogroup "$sandbox"
          run_subject() {
            sudo -u nobody env -i HOME="$sandbox/home" PATH="$PATH" TMPDIR="$sandbox/tmp" \
              CARGO_HOME="$sandbox/cargo" CARGO_TARGET_DIR="$sandbox/target" \
              RUSTUP_HOME="$RUSTUP_HOME" UV_CACHE_DIR="$sandbox/uv" PYTHONDONTWRITEBYTECODE=1 \
              PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 UV_PROJECT_ENVIRONMENT="$sandbox/venv" \
              SUBJECT_ROOT="$eval_root" bash --noprofile --norc -c "$1"
          }
          rust_contracts=false
          if run_subject 'set -euo pipefail; cd "$SUBJECT_ROOT"; cargo +1.97.0 test --locked --test workflow_contract --test docs_contract'; then rust_contracts=true; fi
          python_contracts=false
          if run_subject 'set -euo pipefail; cd "$SUBJECT_ROOT"; uv sync --project benchmarks --python 3.12 --locked; uv run --offline --project benchmarks --locked pytest -q -c /dev/null -p no:cacheprovider benchmarks/tests/test_integration_contract.py benchmarks/tests/test_cloud_execution.py'; then python_contracts=true; fi
          benchmark_smoke=false
          if run_subject 'set -euo pipefail; cd "$SUBJECT_ROOT"; ./scripts/benchmark-smoke.sh'; then benchmark_smoke=true; fi
          observations="$RUNNER_TEMP/soak-observations.json"
          printf '{"benchmark-smoke":%s,"python-contracts":%s,"rust-contracts":%s}' \
            "$benchmark_smoke" "$python_contracts" "$rust_contracts" > "$observations"
          PYTHONPATH=trusted-source/benchmarks/src python -m carl_bench.immutable_inputs soak-health \
            --experiment "$EXPERIMENT_INPUT" --task-set "$TASK_SET_INPUT" \
            --metric-pack "$METRIC_PACK_INPUT" --policy "$POLICY_INPUT" \
            --observations "$observations" --output "$RUNNER_TEMP/health-result.json"

  live_soak:
    name: Require commissioned durable provider reconciliation
    needs: [commission, evaluate]
    environment: carl-autonomy-soak
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 60
    steps:
      - name: Retrieve protected soak inputs and execute exact merge observation
        env:
          ATTEMPT_KEY: ${{ inputs.attempt_key }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          PARENT_COMMIT: ${{ inputs.parent_commit }}
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          SOAK_CADENCE_HOURS: "6"
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: |
          set -euo pipefail
          test "$SOAK_CADENCE_HOURS" = "6"
          run_node() {
            command="$1"; expected="$2"; output="$RUNNER_TEMP/$expected.json"
            set +e
            /opt/carl-autonomy/venv/bin/python3 -I -m carl_bench.cli cloud "$command" > "$output"
            status=$?
            set -e
            python3 - "$output" "$expected" <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          if not 0 < len(raw) <= 16384: raise SystemExit("protected cloud coordinator decision size")
          value = json.loads(raw)
          if value.get("node") not in (None, sys.argv[2]): raise SystemExit("protected node mismatch")
          action = value.get("action")
          if action == 'frozen':
              raise SystemExit(2)
          PY
            test "$status" -eq 0
          }
          PROTECTED_NODE=publish_input run_node publish-input publish_input
          PROTECTED_NODE=observe_soak run_node commission-live observe_soak

  evidence:
    name: Independently observe archive sign and ingest exact merge evidence
    needs: [live_soak]
    environment: carl-autonomy-observer
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 20
    steps:
      - name: Complete protected soak evidence and acceptance handoffs
        env:
          ATTEMPT_KEY: ${{ inputs.attempt_key }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          MAX_PUBLIC_HANDOFF_BYTES: 1048576
          PARENT_COMMIT: ${{ inputs.parent_commit }}
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          SOAK_CADENCE_HOURS: "6"
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: |
          set -euo pipefail
          mkdir -p cloud-handoff
          run_node() {
            expected="$1"; output="cloud-handoff/$expected.json"
            set +e
            /opt/carl-autonomy/venv/bin/python3 -I -m carl_bench.cli cloud commission-live > "$output"
            status=$?
            set -e
            python3 - "$output" "$expected" <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          if not 0 < len(raw) <= 16384: raise SystemExit("protected cloud coordinator decision size")
          value = json.loads(raw)
          if value.get("node") not in (None, sys.argv[2]): raise SystemExit("protected node mismatch")
          action = value.get("action")
          if action == 'frozen':
              raise SystemExit(2)
          PY
            test "$status" -eq 0
          }
          PROTECTED_NODE=observe_soak run_node observe_soak
          PROTECTED_NODE=accept_soak run_node accept_soak
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path("cloud-handoff")
          names = ("accept_soak", "observe_soak")
          handoff = {
              "attempt_key": os.environ["ATTEMPT_KEY"],
              "cadence_hours": 6,
              "decisions": {name: json.loads((root / f"{name}.json").read_text()) for name in names},
              "kind": "protected_soak_handoff",
              "merge_commit": os.environ["CANDIDATE_COMMIT"],
              "parent_commit": os.environ["PARENT_COMMIT"],
              "request_digest": os.environ["REQUEST_DIGEST"],
              "schema_version": 1,
              "workflow_revision": os.environ["WORKFLOW_REVISION"],
          }
          target = root / f"autonomous-soak-{os.environ['REQUEST_DIGEST']}.json"
          target.write_text(json.dumps(handoff, sort_keys=True, separators=(",", ":")) + "\n")
          if target.stat().st_size > min(int(os.environ["MAX_PUBLIC_HANDOFF_BYTES"]), 1_048_576):
              raise SystemExit("public handoff exceeds bound")
          PY
      - name: Upload the one request-named soak artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autonomous-soak-observation-${{ inputs.request_digest }}
          path: cloud-handoff/autonomous-soak-${{ inputs.request_digest }}.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          overwrite: false
          include-hidden-files: false

  rollback_handoff:
    name: Explicitly dispatch protected rollback health recovery
    needs: [evidence]
    environment: carl-autonomy-promoter
    permissions:
      contents: read
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 10
    steps:
      - name: Dispatch without default token recursion
        env:
          ATTEMPT_KEY: ${{ inputs.attempt_key }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          PARENT_COMMIT: ${{ inputs.parent_commit }}
          PROTECTED_NODE: trigger_supervisor
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rollback-handoff.json"
          set +e
          /opt/carl-autonomy/venv/bin/python3 -I -m carl_bench.cli cloud health > "$output"
          status=$?
          set -e
          python3 - "$output" "$PROTECTED_NODE" <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          if not 0 < len(raw) <= 16384: raise SystemExit("protected cloud coordinator decision size")
          value = json.loads(raw)
          if value.get("node") not in (None, sys.argv[2]): raise SystemExit("protected node mismatch")
          action = value.get("action")
          if action == 'frozen':
              raise SystemExit(2)
          PY
          test "$status" -eq 0
