name: Autonomous improvement evidence
run-name: ${{ inputs.attempt_key }}

"on":
  workflow_dispatch:
    inputs:
      attempt_key:
        description: Exact durable cloud dispatch attempt key
        required: true
        type: string
      experiment_digest:
        description: Immutable experiment manifest SHA-256
        required: true
        type: string
      parent_commit:
        description: Exact protected parent commit
        required: true
        type: string
      candidate_commit:
        description: Exact immutable candidate commit
        required: true
        type: string
      task_set_digest:
        description: Canonical improvement task-set JSON SHA-256
        required: true
        type: string
      metric_pack_digest:
        description: Immutable metric-pack SHA-256
        required: true
        type: string
      policy_digest:
        description: Immutable policy SHA-256
        required: true
        type: string
      request_digest:
        description: Canonical cloud request SHA-256
        required: true
        type: string
      workflow_revision:
        description: Exact protected workflow source commit
        required: true
        type: string
      workflow_blob_digest:
        description: Exact protected workflow file SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: autonomous-improvement-${{ inputs.request_digest }}
  cancel-in-progress: false

jobs:
  commission:
    name: Bind immutable builder handoff
    environment: carl-autonomy-builder
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the protected parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.workflow_revision }}
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_commit }}
          path: candidate-source
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact request attempt and protected parent
        env:
          ATTEMPT_KEY: ${{ inputs.attempt_key }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPERIMENT_DIGEST: ${{ inputs.experiment_digest }}
          METRIC_PACK_DIGEST: ${{ inputs.metric_pack_digest }}
          PARENT_COMMIT: ${{ inputs.parent_commit }}
          POLICY_DIGEST: ${{ inputs.policy_digest }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          RUN_HEAD_SHA: ${{ github.sha }}
          TASK_SET_DIGEST: ${{ inputs.task_set_digest }}
          WORKFLOW_BLOB_DIGEST: ${{ inputs.workflow_blob_digest }}
          WORKFLOW_PATH: .github/workflows/autonomous-improvement.yml
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$RUN_HEAD_SHA" = "$WORKFLOW_REVISION"
          test "$WORKFLOW_SHA" = "$WORKFLOW_REVISION"
          test "${WORKFLOW_REF%%@*}" = "$REPOSITORY/$WORKFLOW_PATH"
          test "$(git -C trusted-source rev-parse HEAD)" = "$WORKFLOW_REVISION"
          test "$(git -C candidate-source rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          printf '%s  %s\n' "$WORKFLOW_BLOB_DIGEST" \
            "trusted-source/$WORKFLOW_PATH" | sha256sum --check --strict -
          python3 - <<'PY'
          import hashlib, json, os, re
          digest = re.compile(r"[0-9a-f]{64}\Z")
          commit = re.compile(r"(?:[0-9a-f]{40}|[0-9a-f]{64})\Z")
          for name in ("EXPERIMENT_DIGEST", "METRIC_PACK_DIGEST", "POLICY_DIGEST",
                       "REQUEST_DIGEST", "TASK_SET_DIGEST", "WORKFLOW_BLOB_DIGEST"):
              if not digest.fullmatch(os.environ[name]): raise SystemExit(f"invalid {name.lower()}")
          for name in ("PARENT_COMMIT", "CANDIDATE_COMMIT", "WORKFLOW_REVISION"):
              if not commit.fullmatch(os.environ[name]): raise SystemExit(f"invalid {name.lower()}")
          prefix = f"cloud-run-{os.environ['REQUEST_DIGEST']}-attempt-"
          if os.environ["ATTEMPT_KEY"] not in {prefix + "1", prefix + "2", prefix + "3"}:
              raise SystemExit("attempt_key mismatch")
          payload = {
              "candidate_commit": os.environ["CANDIDATE_COMMIT"],
              "experiment_digest": os.environ["EXPERIMENT_DIGEST"],
              "metric_pack_digest": os.environ["METRIC_PACK_DIGEST"],
              "parent_commit": os.environ["PARENT_COMMIT"],
              "policy_digest": os.environ["POLICY_DIGEST"],
              "repository": os.environ["REPOSITORY"],
              "schema_version": 1,
              "task_set_digest": os.environ["TASK_SET_DIGEST"],
              "workflow_file": "autonomous-improvement.yml",
              "workflow_revision": os.environ["WORKFLOW_REVISION"],
              "workflow_blob_digest": os.environ["WORKFLOW_BLOB_DIGEST"],
          }
          encoded = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          if hashlib.sha256(encoded).hexdigest() != os.environ["REQUEST_DIGEST"]:
              raise SystemExit("request_digest mismatch")
          PY
      - name: Run actionlint commissioning gate
        working-directory: trusted-source
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            .github/workflows/autonomous-improvement.yml \
            .github/workflows/autonomous-soak.yml

  evaluate:
    name: Run secret-free exact parent and candidate pair
    needs: [commission]
    outputs:
      paired_result_digest: ${{ steps.pair.outputs.paired_result_digest }}
    environment: carl-autonomy-subject
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted harness from protected parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.workflow_revision }}
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact parent subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.parent_commit }}
          path: subject-parent
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact candidate subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_commit }}
          path: subject-candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.12"
          enable-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - name: Verify exact subjects and immutable inputs
        id: immutable_inputs
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPERIMENT_DIGEST: ${{ inputs.experiment_digest }}
          METRIC_PACK_DIGEST: ${{ inputs.metric_pack_digest }}
          PARENT_COMMIT: ${{ inputs.parent_commit }}
          POLICY_DIGEST: ${{ inputs.policy_digest }}
          TASK_SET_DIGEST: ${{ inputs.task_set_digest }}
        run: |
          set -euo pipefail
          test "$(git -C subject-parent rev-parse HEAD)" = "$PARENT_COMMIT"
          test "$(git -C subject-candidate rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          resolved="$RUNNER_TEMP/immutable-inputs"; mkdir -p "$resolved"
          PYTHONPATH=trusted-source/benchmarks/src python -m carl_bench.immutable_inputs resolve-set \
            --registry trusted-source/benchmarks/immutable-inputs/registry.json \
            --root trusted-source/benchmarks/immutable-inputs \
            --mode improvement \
            --task-media-type application/vnd.carl.improvement-task-set+json \
            --experiment-digest "$EXPERIMENT_DIGEST" \
            --task-set-digest "$TASK_SET_DIGEST" \
            --metric-pack-digest "$METRIC_PACK_DIGEST" \
            --policy-digest "$POLICY_DIGEST" \
            --output-dir "$resolved" >/dev/null
          printf '%s  %s\n' \
            "$EXPERIMENT_DIGEST" "$resolved/experiment" \
            "$TASK_SET_DIGEST" "$resolved/task-set" \
            "$METRIC_PACK_DIGEST" "$resolved/metric-pack" \
            "$POLICY_DIGEST" "$resolved/policy" \
            | sha256sum --check --strict -
          printf 'experiment=%s\n' "$resolved/experiment" >> "$GITHUB_OUTPUT"
          printf 'task_set=%s\n' "$resolved/task-set" >> "$GITHUB_OUTPUT"
          printf 'metric_pack=%s\n' "$resolved/metric-pack" >> "$GITHUB_OUTPUT"
          printf 'policy=%s\n' "$resolved/policy" >> "$GITHUB_OUTPUT"
      - name: Build exact subjects under distinct Unix identities
        id: build
        run: |
          set -euo pipefail
          chmod 700 "$(dirname "$GITHUB_ENV")"
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin carlparent
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin carlcandidate
          parent_root="$RUNNER_TEMP/build-parent"; candidate_root="$RUNNER_TEMP/build-candidate"
          bound="$RUNNER_TEMP/bound-subjects"
          sudo install -d -m 0700 -o carlparent -g carlparent \
            "$parent_root" "$parent_root/home" "$parent_root/tmp" \
            "$parent_root/cargo" "$parent_root/target"
          sudo install -d -m 0700 -o carlcandidate -g carlcandidate \
            "$candidate_root" "$candidate_root/home" "$candidate_root/tmp" \
            "$candidate_root/cargo" "$candidate_root/target"
          install -d -m 0700 "$bound"
          sudo -u carlparent env -i HOME="$parent_root/home" PATH="$PATH" \
            TMPDIR="$parent_root/tmp" CARGO_HOME="$parent_root/cargo" \
            CARGO_TARGET_DIR="$parent_root/target" RUSTUP_HOME="$RUSTUP_HOME" \
            cargo +1.97.0 build --locked --release --manifest-path subject-parent/Cargo.toml
          parent_binary="$parent_root/target/release/carl"
          test -x "$parent_binary"; test ! -L "$parent_binary"
          sha256sum "$parent_binary" > "$bound/parent.sha256"
          parent_digest="$(cut -d' ' -f1 "$bound/parent.sha256")"
          chmod 0444 "$bound/parent.sha256"
          chmod -R a-w "$parent_root"; chmod -R go+rX "$parent_root"
          sudo -u carlcandidate test ! -w "$parent_root"
          sudo -u carlcandidate test ! -w "$parent_binary"
          sudo -u carlcandidate env -i HOME="$candidate_root/home" PATH="$PATH" \
            TMPDIR="$candidate_root/tmp" CARGO_HOME="$candidate_root/cargo" \
            CARGO_TARGET_DIR="$candidate_root/target" RUSTUP_HOME="$RUSTUP_HOME" \
            cargo +1.97.0 build --locked --release --manifest-path subject-candidate/Cargo.toml
          candidate_binary="$candidate_root/target/release/carl"
          test -x "$candidate_binary"; test ! -L "$candidate_binary"
          sha256sum "$candidate_binary" > "$bound/candidate.sha256"
          candidate_digest="$(cut -d' ' -f1 "$bound/candidate.sha256")"
          chmod 0444 "$bound/candidate.sha256"
          chmod -R a-w "$candidate_root"; chmod -R go+rX "$candidate_root"
          (cd / && sha256sum --check "$bound/parent.sha256")
          printf 'parent_binary_digest=%s\n' "$parent_digest" >> "$GITHUB_OUTPUT"
          printf 'candidate_binary_digest=%s\n' "$candidate_digest" >> "$GITHUB_OUTPUT"
      - name: Run the protected-parent harness against both exact binaries
        id: pair
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPERIMENT_INPUT: ${{ steps.immutable_inputs.outputs.experiment }}
          METRIC_PACK_INPUT: ${{ steps.immutable_inputs.outputs.metric_pack }}
          PARENT_COMMIT: ${{ inputs.parent_commit }}
          POLICY_INPUT: ${{ steps.immutable_inputs.outputs.policy }}
          TASK_SET_INPUT: ${{ steps.immutable_inputs.outputs.task_set }}
        run: |
          set -euo pipefail
          chmod 700 "$(dirname "$GITHUB_ENV")"
          results="$RUNNER_TEMP/paired-results"; sandbox="$RUNNER_TEMP/harness-sandbox"
          bound="$RUNNER_TEMP/bound-subjects"
          sudo install -d -m 0700 -o root -g root "$results" "$sandbox" "$sandbox/home" "$sandbox/tmp"
          test "$(id -u)" != "$(id -u carlparent)"
          test "$(id -u)" != "$(id -u carlcandidate)"
          sudo -u carlparent test ! -r "$results"
          sudo -u carlcandidate test ! -r "$results"
          (cd / && sha256sum --check "$bound/parent.sha256")
          (cd / && sha256sum --check "$bound/candidate.sha256")
          uv sync --project trusted-source/benchmarks --python 3.12 --locked
          sudo env -i HOME="$sandbox/home" PATH="$PATH" TMPDIR="$sandbox/tmp" \
            PYTHONDONTWRITEBYTECODE=1 \
            trusted-source/benchmarks/.venv/bin/python -m carl_bench.cloud_harness \
              --parent-binary "$RUNNER_TEMP/build-parent/target/release/carl" \
              --candidate-binary "$RUNNER_TEMP/build-candidate/target/release/carl" \
              --parent-commit "$PARENT_COMMIT" --candidate-commit "$CANDIDATE_COMMIT" \
              --experiment "$EXPERIMENT_INPUT" --task-set "$TASK_SET_INPUT" \
              --metric-pack "$METRIC_PACK_INPUT" --policy "$POLICY_INPUT" \
              --parent-uid carlparent --candidate-uid carlcandidate \
              --mode improvement --output "$results/paired-result.json"
          (cd / && sha256sum --check "$bound/parent.sha256")
          (cd / && sha256sum --check "$bound/candidate.sha256")
          test -f "$results/paired-result.json"; test ! -L "$results/paired-result.json"
          test "$(stat -c '%u:%a' "$results/paired-result.json")" = "0:600"
          sudo -u carlparent test ! -r "$results/paired-result.json"
          sudo -u carlcandidate test ! -r "$results/paired-result.json"
          test "$(wc -c < "$results/paired-result.json")" -le 262145
          outcome_handoff="$RUNNER_TEMP/paired-outcome-handoff"
          install -d -m 0700 "$outcome_handoff"
          sudo install -m 0400 -o "$(id -u)" -g "$(id -g)" \
            "$results/paired-result.json" "$outcome_handoff/paired-result.json"
          sudo -u carlparent test ! -r "$outcome_handoff/paired-result.json"
          sudo -u carlcandidate test ! -r "$outcome_handoff/paired-result.json"
          paired_result_digest="$(sha256sum "$outcome_handoff/paired-result.json" | cut -d' ' -f1)"
          printf 'paired_result_digest=%s\n' "$paired_result_digest" >> "$GITHUB_OUTPUT"
      - name: Hand exact paired outcome to the protected observer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-improvement-outcome-${{ inputs.request_digest }}
          path: ${{ runner.temp }}/paired-outcome-handoff/paired-result.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  publish_private_inputs:
    name: Retrieve private input through protected authority
    needs: [commission]
    environment: carl-autonomy-validator
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 10
    steps:
      - name: Publish exact protected input request
        env:
          ATTEMPT_KEY: ${{ inputs.attempt_key }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          PARENT_COMMIT: ${{ inputs.parent_commit }}
          PROTECTED_NODE: publish_input
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/publish-input.json"
          /opt/carl-autonomy/venv/bin/python3 -I - \
            publish-input "$PROTECTED_NODE" register_hypothesis "$REQUEST_DIGEST" "$output" <<'PY'
          import hashlib, json, os, pathlib, re, stat, sys
          from carl_bench.canonical import canonical_json_bytes
          from carl_bench.cloud_coordinator import CloudCoordinatorDecision
          from carl_bench.coordinator_client import CoordinatorSocketClient
          from carl_bench.coordinator_ipc import CoordinatorServiceRequest

          command, expected_node, expected_successor, workflow_request_digest, output = sys.argv[1:]
          digest = re.compile(r"[0-9a-f]{64}\Z")
          client = CoordinatorSocketClient.from_protected_environment()
          request = CoordinatorServiceRequest.create(command)
          expected_ipc_digest = request.digest

          FREEZE_ROOT = pathlib.Path("/var/lib/carl/protected-workflow-freezes")

          def protected_freeze_directory(path):
              metadata = os.lstat(path)
              if (not stat.S_ISDIR(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode)
                      or metadata.st_uid != 0 or stat.S_IMODE(metadata.st_mode) != 0o700):
                  raise SystemExit("workflow_stage_freeze_storage_invalid")

          def reject_request_freeze() -> None:
              if re.fullmatch(r"[0-9a-f]{64}", workflow_request_digest) is None:
                  raise SystemExit("workflow_request_digest_invalid")
              if not FREEZE_ROOT.exists():
                  return
              protected_freeze_directory(FREEZE_ROOT)
              request_root = FREEZE_ROOT / workflow_request_digest
              if not request_root.exists():
                  return
              protected_freeze_directory(request_root)
              entries = sorted(request_root.iterdir())
              if not entries:
                  raise SystemExit("workflow_request_frozen")
              for entry in entries:
                  metadata = os.lstat(entry)
                  raw = entry.read_bytes()
                  if (not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode)
                          or metadata.st_uid != 0 or stat.S_IMODE(metadata.st_mode) != 0o400
                          or not 0 < len(raw) <= 4096):
                      raise SystemExit("workflow_stage_freeze_receipt_invalid")
                  value = json.loads(raw)
                  core = {key: item for key, item in value.items() if key != "freeze_identity"}
                  if (set(value) != {"domain", "freeze_identity", "node", "reason",
                                    "request_digest", "schema_version", "status", "successor"}
                          or canonical_json_bytes(value) + b"\n" != raw
                          or value["domain"] != "carl.workflow-stage-freeze.v1"
                          or value["schema_version"] != 1
                          or value["status"] != "frozen"
                          or value["request_digest"] != workflow_request_digest
                          or hashlib.sha256(canonical_json_bytes(core)).hexdigest()
                          != value["freeze_identity"]):
                      raise SystemExit("workflow_stage_freeze_receipt_invalid")
              raise SystemExit("workflow_request_frozen")

          def persist_exact_node_freeze() -> None:
              try:
                  if (re.fullmatch(r"[0-9a-f]{64}", workflow_request_digest) is None
                          or re.fullmatch(r"[a-z][a-z0-9_]{0,63}", expected_node) is None
                          or re.fullmatch(r"[a-z][a-z0-9_]{0,63}", expected_successor) is None):
                      raise SystemExit("workflow_stage_freeze_identity_invalid")
                  FREEZE_ROOT.mkdir(parents=True, mode=0o700, exist_ok=True)
                  protected_freeze_directory(FREEZE_ROOT)
                  request_root = FREEZE_ROOT / workflow_request_digest
                  request_root.mkdir(mode=0o700, exist_ok=True)
                  protected_freeze_directory(request_root)
                  core = {
                      "domain": "carl.workflow-stage-freeze.v1",
                      "node": expected_node,
                      "reason": "workflow_stage_response_invalid",
                      "request_digest": workflow_request_digest,
                      "schema_version": 1,
                      "status": "frozen",
                      "successor": expected_successor,
                  }
                  receipt = {
                      **core,
                      "freeze_identity": hashlib.sha256(canonical_json_bytes(core)).hexdigest(),
                  }
                  raw = canonical_json_bytes(receipt) + b"\n"
                  target = request_root / f"{expected_node}.json"
                  try:
                      descriptor = os.open(
                          target,
                          os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                          0o400,
                      )
                  except FileExistsError:
                      if target.read_bytes() != raw:
                          raise SystemExit("workflow_stage_freeze_receipt_conflict") from None
                  else:
                      try:
                          written = 0
                          while written < len(raw):
                              count = os.write(descriptor, raw[written:])
                              if count <= 0:
                                  raise SystemExit("workflow_stage_freeze_write_failed")
                              written += count
                          os.fsync(descriptor)
                      finally:
                          os.close(descriptor)
                      os.chmod(target, 0o400, follow_symlinks=False)
                      directory = os.open(request_root, os.O_RDONLY | os.O_DIRECTORY)
                      try:
                          os.fsync(directory)
                      finally:
                          os.close(directory)
                  try:
                      client.execute(CoordinatorServiceRequest.create("health"))
                  except Exception:
                      pass
              finally:
                  raise SystemExit("workflow_stage_response_invalid")

          reject_request_freeze()

          try:
              if expected_successor != "register_hypothesis":
                  persist_exact_node_freeze()
              for _ in range(6):
                  response = client.execute(request)
                  value = response.to_canonical_dict()
                  if set(value) != {"domain", "error_code", "request_digest", "result",
                                    "schema_version", "status"}:
                      persist_exact_node_freeze()
                  if (value["schema_version"] != 1
                          or value["domain"] != "carl.coordinator.ipc.response.v1"
                          or value["status"] != "completed"
                          or value["error_code"] is not None
                          or value["request_digest"] != expected_ipc_digest):
                      persist_exact_node_freeze()
                  result = CloudCoordinatorDecision.from_canonical_dict(value["result"]).to_canonical_dict()
                  if result["node"] != expected_node:
                      persist_exact_node_freeze()
                  action = result["action"]
                  command_value = result["command"]
                  if (type(command_value) is not dict
                          or command_value.get("request_digest") != workflow_request_digest):
                      persist_exact_node_freeze()
                  if action == "complete_command":
                      if (result["reason"] != "observed_effect_completion_required"
                              or result["consequential"] is not True
                              or result["remote_effect"] is not False
                              or digest.fullmatch(result["result_digest"] or "") is None):
                          persist_exact_node_freeze()
                      stage = {
                          "action": action,
                          "domain": "carl.protected-workflow-stage.v1",
                          "identity": result["identity"],
                          "node": expected_node,
                          "protected_receipt_digest": result["result_digest"],
                          "request_digest": workflow_request_digest,
                          "schema_version": 1,
                          "status": "completed",
                          "successor": expected_successor,
                      }
                      pathlib.Path(output).write_bytes(canonical_json_bytes(stage) + b"\n")
                      break
                  reasons = {
                      "claim_command": "command_claim_required",
                      "execute_effect": "persisted_command_ready",
                      "persist_command": "command_persistence_required",
                      "reconcile_effect": {"effect_response_lost", "effect_retry_ready"},
                  }
                  expected_reason = reasons.get(action)
                  if expected_reason is None or (
                      result["reason"] not in expected_reason
                      if isinstance(expected_reason, set)
                      else result["reason"] != expected_reason
                  ):
                      persist_exact_node_freeze()
                  expected_remote_effect = (
                      action in {"execute_effect", "reconcile_effect"}
                      and expected_node not in {"accept_soak", "record_disposition", "trigger_supervisor"}
                  )
                  if (result["consequential"] is not True
                          or result["remote_effect"] is not expected_remote_effect
                          or result["result_digest"] is not None):
                      persist_exact_node_freeze()
                  if action in {"persist_command", "claim_command"}:
                      if result["effect_key"] is not None:
                          persist_exact_node_freeze()
                  elif result["effect_key"] != command_value["effect_key"]:
                      persist_exact_node_freeze()
              else:
                  persist_exact_node_freeze()
          except Exception:
              persist_exact_node_freeze()
          PY

  live_validation:
    name: Require commissioned durable provider reconciliation
    needs: [evaluate, publish_private_inputs]
    environment: carl-autonomy-validator
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 60
    steps:
      - name: Execute protected live evaluator
        env:
          ATTEMPT_KEY: ${{ inputs.attempt_key }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          PARENT_COMMIT: ${{ inputs.parent_commit }}
          PROTECTED_NODE: dispatch_validation
          REQUEST_DIGEST: ${{ inputs.request_digest }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/live-validation.json"
          /opt/carl-autonomy/venv/bin/python3 -I - \
            commission-live "$PROTECTED_NODE" observe_validation "$REQUEST_DIGEST" "$output" <<'PY'
          import hashlib, json, os, pathlib, re, stat, sys
          from carl_bench.canonical import canonical_json_bytes
          from carl_bench.cloud_coordinator import CloudCoordinatorDecision
          from carl_bench.coordinator_client import CoordinatorSocketClient
          from carl_bench.coordinator_ipc import CoordinatorServiceRequest

          command, expected_node, expected_successor, workflow_request_digest, output = sys.argv[1:]
          digest = re.compile(r"[0-9a-f]{64}\Z")
          client = CoordinatorSocketClient.from_protected_environment()
          request = CoordinatorServiceRequest.create(command)
          expected_ipc_digest = request.digest

          FREEZE_ROOT = pathlib.Path("/var/lib/carl/protected-workflow-freezes")

          def protected_freeze_directory(path):
              metadata = os.lstat(path)
              if (not stat.S_ISDIR(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode)
                      or metadata.st_uid != 0 or stat.S_IMODE(metadata.st_mode) != 0o700):
                  raise SystemExit("workflow_stage_freeze_storage_invalid")

          def reject_request_freeze() -> None:
              if re.fullmatch(r"[0-9a-f]{64}", workflow_request_digest) is None:
                  raise SystemExit("workflow_request_digest_invalid")
              if not FREEZE_ROOT.exists():
                  return
              protected_freeze_directory(FREEZE_ROOT)
              request_root = FREEZE_ROOT / workflow_request_digest
              if not request_root.exists():
                  return
              protected_freeze_directory(request_root)
              entries = sorted(request_root.iterdir())
              if not entries:
                  raise SystemExit("workflow_request_frozen")
              for entry in entries:
                  metadata = os.lstat(entry)
                  raw = entry.read_bytes()
                  if (not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode)
                          or metadata.st_uid != 0 or stat.S_IMODE(metadata.st_mode) != 0o400
                          or not 0 < len(raw) <= 4096):
                      raise SystemExit("workflow_stage_freeze_receipt_invalid")
                  value = json.loads(raw)
                  core = {key: item for key, item in value.items() if key != "freeze_identity"}
                  if (set(value) != {"domain", "freeze_identity", "node", "reason",
                                    "request_digest", "schema_version", "status", "successor"}
                          or canonical_json_bytes(value) + b"\n" != raw
                          or value["domain"] != "carl.workflow-stage-freeze.v1"
                          or value["schema_version"] != 1
                          or value["status"] != "frozen"
                          or value["request_digest"] != workflow_request_digest
                          or hashlib.sha256(canonical_json_bytes(core)).hexdigest()
                          != value["freeze_identity"]):
                      raise SystemExit("workflow_stage_freeze_receipt_invalid")
              raise SystemExit("workflow_request_frozen")

          def persist_exact_node_freeze() -> None:
              try:
                  if (re.fullmatch(r"[0-9a-f]{64}", workflow_request_digest) is None
                          or re.fullmatch(r"[a-z][a-z0-9_]{0,63}", expected_node) is None
                          or re.fullmatch(r"[a-z][a-z0-9_]{0,63}", expected_successor) is None):
                      raise SystemExit("workflow_stage_freeze_identity_invalid")
                  FREEZE_ROOT.mkdir(parents=True, mode=0o700, exist_ok=True)
                  protected_freeze_directory(FREEZE_ROOT)
                  request_root = FREEZE_ROOT / workflow_request_digest
                  request_root.mkdir(mode=0o700, exist_ok=True)
                  protected_freeze_directory(request_root)
                  core = {
                      "domain": "carl.workflow-stage-freeze.v1",
                      "node": expected_node,
                      "reason": "workflow_stage_response_invalid",
                      "request_digest": workflow_request_digest,
                      "schema_version": 1,
                      "status": "frozen",
                      "successor": expected_successor,
                  }
                  receipt = {
                      **core,
                      "freeze_identity": hashlib.sha256(canonical_json_bytes(core)).hexdigest(),
                  }
                  raw = canonical_json_bytes(receipt) + b"\n"
                  target = request_root / f"{expected_node}.json"
                  try:
                      descriptor = os.open(
                          target,
                          os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                          0o400,
                      )
                  except FileExistsError:
                      if target.read_bytes() != raw:
                          raise SystemExit("workflow_stage_freeze_receipt_conflict") from None
                  else:
                      try:
                          written = 0
                          while written < len(raw):
                              count = os.write(descriptor, raw[written:])
                              if count <= 0:
                                  raise SystemExit("workflow_stage_freeze_write_failed")
                              written += count
                          os.fsync(descriptor)
                      finally:
                          os.close(descriptor)
                      os.chmod(target, 0o400, follow_symlinks=False)
                      directory = os.open(request_root, os.O_RDONLY | os.O_DIRECTORY)
                      try:
                          os.fsync(directory)
                      finally:
                          os.close(directory)
                  try:
                      client.execute(CoordinatorServiceRequest.create("health"))
                  except Exception:
                      pass
              finally:
                  raise SystemExit("workflow_stage_response_invalid")

          reject_request_freeze()

          try:
              if expected_successor != "observe_validation":
                  persist_exact_node_freeze()
              for _ in range(6):
                  response = client.execute(request)
                  value = response.to_canonical_dict()
                  if set(value) != {"domain", "error_code", "request_digest", "result",
                                    "schema_version", "status"}:
                      persist_exact_node_freeze()
                  if (value["schema_version"] != 1
                          or value["domain"] != "carl.coordinator.ipc.response.v1"
                          or value["status"] != "completed"
                          or value["error_code"] is not None
                          or value["request_digest"] != expected_ipc_digest):
                      persist_exact_node_freeze()
                  result = CloudCoordinatorDecision.from_canonical_dict(value["result"]).to_canonical_dict()
                  if result["node"] != expected_node:
                      persist_exact_node_freeze()
                  action = result["action"]
                  command_value = result["command"]
                  if (type(command_value) is not dict
                          or command_value.get("request_digest") != workflow_request_digest):
                      persist_exact_node_freeze()
                  if action == "complete_command":
                      if (result["reason"] != "observed_effect_completion_required"
                              or result["consequential"] is not True
                              or result["remote_effect"] is not False
                              or digest.fullmatch(result["result_digest"] or "") is None):
                          persist_exact_node_freeze()
                      stage = {
                          "action": action,
                          "domain": "carl.protected-workflow-stage.v1",
                          "identity": result["identity"],
                          "node": expected_node,
                          "protected_receipt_digest": result["result_digest"],
                          "request_digest": workflow_request_digest,
                          "schema_version": 1,
                          "status": "completed",
                          "successor": expected_successor,
                      }
                      pathlib.Path(output).write_bytes(canonical_json_bytes(stage) + b"\n")
                      break
                  reasons = {
                      "claim_command": "command_claim_required",
                      "execute_effect": "persisted_command_ready",
                      "persist_command": "command_persistence_required",
                      "reconcile_effect": {"effect_response_lost", "effect_retry_ready"},
                  }
                  expected_reason = reasons.get(action)
                  if expected_reason is None or (
                      result["reason"] not in expected_reason
                      if isinstance(expected_reason, set)
                      else result["reason"] != expected_reason
                  ):
                      persist_exact_node_freeze()
                  expected_remote_effect = (
                      action in {"execute_effect", "reconcile_effect"}
                      and expected_node not in {"accept_soak", "record_disposition", "trigger_supervisor"}
                  )
                  if (result["consequential"] is not True
                          or result["remote_effect"] is not expected_remote_effect
                          or result["result_digest"] is not None):
                      persist_exact_node_freeze()
                  if action in {"persist_command", "claim_command"}:
                      if result["effect_key"] is not None:
                          persist_exact_node_freeze()
                  elif result["effect_key"] != command_value["effect_key"]:
                      persist_exact_node_freeze()
              else:
                  persist_exact_node_freeze()
          except Exception:
              persist_exact_node_freeze()
          PY

