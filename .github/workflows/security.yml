name: Security

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform autonomy profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/autonomy/aws
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.9
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize Terraform without a backend
        run: terraform init -backend=false
      - name: Validate Terraform
        run: terraform validate
      - name: Test Terraform security contracts
        run: terraform test

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Check RustSec advisories
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check dependency policy
        run: cargo deny check
