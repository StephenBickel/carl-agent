name: Carl cloud autonomy coordinator

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carl-autonomy-coordinator-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Advance one durable autonomy node
    environment: carl-autonomy-coordinator
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, linux, x64, carl-autonomy-cloud]
    timeout-minutes: 10
    steps:
      - name: Check out the protected default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.12"
          enable-cache: false
      - name: Reconstruct durable truth and advance one safe node
        env:
          MAX_COORDINATOR_RESULT_BYTES: "1048576"
        run: |
          set -euo pipefail
          set +e
          RESULT="$(uv run --offline --project benchmarks --locked carl-bench cloud coordinate)"
          STATUS=$?
          set -e
          test "$STATUS" -eq 0 -o "$STATUS" -eq 2
          RESULT="$RESULT" uv run --offline --project benchmarks --locked python - <<'PY'
          import json
          import os

          from carl_bench.canonical import canonical_json_bytes

          raw = os.environ["RESULT"].encode("utf-8")
          limit = int(os.environ["MAX_COORDINATOR_RESULT_BYTES"])
          if not 0 < len(raw) <= limit:
              raise SystemExit("coordinator_result_size_invalid")
          value = json.loads(raw)
          if canonical_json_bytes(value) != raw:
              raise SystemExit("coordinator_result_not_canonical")
          if not isinstance(value, dict) or value.get("schema_version") != 1:
              raise SystemExit("coordinator_result_schema_invalid")
          PY
          printf '%s\n' "$RESULT"
          exit "$STATUS"
