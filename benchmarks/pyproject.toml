[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "carl-bench"
version = "0.1.0"
description = "Reproducible benchmark lab for the Carl agent harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==46.0.5",
    "psycopg[binary]==3.2.9",
]

[project.scripts]
carl-bench = "carl_bench.cli:main"
carl-coordinator-service = "carl_bench.coordinator_service:main"
carl-coordinator-effect-service = "carl_bench.coordinator_effect_service:main"
carl-github-effect-service = "carl_bench.github_effect_service:main"
carl-live-evaluation-service = "carl_bench.live_evaluation_service:main"
carl-live-gateway-service = "carl_bench.live_gateway_service:main"
carl-live-runner = "carl_bench.live_runner_client:main"

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.11",
]
harbor = [
    "harbor==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carl_bench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
