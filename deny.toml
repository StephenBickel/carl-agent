[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    # cap-std's Windows support reaches winx under Apache-2.0 with the
    # standard LLVM exception; both terms are permissive and compatible.
    "Apache-2.0 WITH LLVM-exception",
    # subtle's constant-time cryptographic primitives use this permissive,
    # attribution-preserving license.
    "BSD-3-Clause",
    # ring's reviewed untrusted implementation uses the permissive ISC license.
    "ISC",
    "MIT",
    # webpki-roots distributes Mozilla's public trust-anchor data under this
    # permissive, attribution-preserving data license.
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
